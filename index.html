<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="競馬AI">
<link rel="manifest" href="manifest.json">
<title>競馬AIガイド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#111318;--bg2:#1a1d24;--bg3:#22252f;--gold:#d4a017;--gold3:#7a5a00;--text:#e8e0d0;--text2:#aaa;--text3:#666;--r:12px;--rs:8px}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
.hdr{background:var(--bg);padding:env(safe-area-inset-top,10px) 16px 0;border-bottom:1px solid #232830;flex-shrink:0}
.hdr-top{display:flex;align-items:center;padding-bottom:8px;gap:10px}
.hdr-date{font-size:14px;color:var(--gold);font-weight:700}
.hdr-sub{font-size:11px;color:var(--text3);margin-top:1px}
.hdr-title{font-size:17px;font-weight:700;flex:0 0 auto}
.hdr-btn{width:34px;height:34px;background:var(--bg3);border:1px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;flex-shrink:0}
.hdr-btn:active{opacity:.7}
.mtabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 2px}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex:0 0 auto;padding:8px 14px;font-size:13px;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.mtab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom,0px)+4px)}
.bnav{display:flex;background:var(--bg);border-top:1px solid #232830;padding-bottom:env(safe-area-inset-bottom,0);flex-shrink:0}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;cursor:pointer;color:var(--text3);gap:2px}
.bn.on{color:var(--gold)}
.bn-icon{font-size:21px;line-height:1}
.bn-lbl{font-size:9px;font-weight:600;letter-spacing:.03em}
.bn:active{opacity:.6}
/* loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:14px}
.spinner{width:36px;height:36px;border:3px solid #2a2d35;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:13px;color:var(--text2)}
.err-box{display:flex;flex-direction:column;align-items:center;padding:48px 24px;gap:12px;text-align:center}
.err-icon{font-size:36px}
.err-msg{font-size:13px;color:var(--text2);line-height:1.6}
.retry-btn{margin-top:8px;padding:11px 28px;background:var(--bg3);border:1px solid #555;border-radius:var(--r);font-size:14px;color:var(--text);cursor:pointer}
.retry-btn:active{opacity:.7}
/* venue chips */
.vsel{padding:10px 12px;background:var(--bg);border-bottom:1px solid #232830;position:sticky;top:0;z-index:20}
.vsel-lbl{font-size:10px;color:var(--text3);margin-bottom:6px;letter-spacing:.07em}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vc{padding:5px 11px;background:var(--bg3);border:1px solid #333;border-radius:18px;font-size:12px;cursor:pointer;transition:.1s}
.vc.on{border-color:var(--gold);color:var(--gold);background:#1e1900}
.vc:active{transform:scale(.93)}
/* venue block */
.vblock{border-bottom:3px solid #1e2128}
.vhdr{display:flex;align-items:center;padding:10px 14px;background:var(--bg2);gap:8px;border-bottom:1px solid #2a2d35}
.vname{font-size:16px;font-weight:700;flex:1}
.vcount{font-size:11px;color:var(--text3)}
/* half divider */
.hdiv{padding:4px 14px;font-size:10px;letter-spacing:.08em;background:#13161d;border-bottom:1px solid #1e2028}
.hdiv.fh{color:#4a5060}
.hdiv.bh{color:var(--gold3)}
/* race rows */
.rrow{display:flex;align-items:flex-start;padding:9px 14px;border-left:3px solid #1e2028;border-bottom:1px solid #191c22;gap:0;cursor:default}
.rrow.t{border-left-color:#3dbf78;background:rgba(61,191,120,.08)}
.rrow.h{border-left-color:#2ea05a;background:rgba(46,160,90,.05)}
.rrow.m{border-left-color:#5090d0;background:rgba(80,144,208,.05)}
.rrow.l{border-left-color:#b06010}
.rrow.s{opacity:.45}
.rrow.x{opacity:.22}
.rrow.nd{opacity:.35}
/* row left: time + rnum */
.rl{display:flex;flex-direction:column;align-items:center;width:40px;flex-shrink:0;padding-top:1px;gap:2px}
.rtime{font-size:10px;color:var(--text3);white-space:nowrap}
.rnum{font-size:13px;font-weight:700;color:var(--text2)}
/* row center: dist + tag */
.rc2{flex:1;min-width:0;padding:0 8px}
.rdist{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rsurf{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:700;vertical-align:middle}
.rsurf.turf{background:#1a3020;color:#3a9a58}
.rsurf.dirt{background:#2a1e0a;color:#9a6020}
.rtkt{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5}
.rnote{font-size:11px;color:#5a5a5a;margin-top:2px}
/* tag pill */
.rtag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.rtag.t{background:#1a3a28;color:#3dbf78}
.rtag.h{background:#162c1e;color:#2ea05a}
.rtag.m{background:#1a2637;color:#5090d0}
.rtag.l{background:#251c08;color:#b07020}
.rtag.s{background:#1e1e1e;color:#666}
.rtag.x{background:#1e1212;color:#a03030}
.rtag.nd{background:#1a1a1a;color:#555}
/* no data */
.rrow-nd{padding:10px 14px;font-size:12px;color:#3a3d45;border-bottom:1px solid #191c22;font-style:italic}
/* browse styles */
.sbar{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #232830;position:sticky;top:0;background:var(--bg);z-index:15}
.sbar::-webkit-scrollbar{display:none}
.sbtn{flex:0 0 auto;padding:5px 12px;background:var(--bg3);border:1px solid #333;border-radius:16px;font-size:12px;cursor:pointer;white-space:nowrap}
.sbtn.on{background:#1e1900;border-color:var(--gold);color:var(--gold)}
.sbtn:active{transform:scale(.95)}
.slbl{font-size:12px;font-weight:600;padding:3px 10px;border-radius:10px;display:inline-flex;margin:10px 12px 4px}
.slbl.a{background:#1a3020;color:#3dbf78}
.slbl.b{background:#2a2010;color:#e09020}
.slbl.c{background:#1a1a2a;color:#5090d0}
.sc{background:var(--bg2);border:1px solid #2a2d35;border-radius:var(--r);margin:4px 12px;padding:11px 14px}
.sd{font-size:15px;font-weight:700}
.sr{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.st{font-size:13px;color:var(--text);margin-top:6px;line-height:1.5}
.sn{font-size:11px;color:var(--text2);margin-top:4px}
/* match */
.mwrap{padding:12px}
.mhint{font-size:12px;color:var(--text2);background:var(--bg2);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;line-height:1.5}
.mrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.mrn{font-size:13px;font-weight:700;color:var(--gold);width:28px;flex-shrink:0}
.minp{flex:1;background:var(--bg3);border:1px solid #444;border-radius:var(--rs);padding:8px 10px;font-size:14px;color:var(--text)}
.minp:focus{outline:none;border-color:var(--gold)}
.mdel{width:32px;height:32px;background:var(--bg3);border:1px solid #444;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex-shrink:0;color:var(--text2)}
.madd{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:10px;background:var(--bg2);border:1px dashed #444;border-radius:var(--rs);font-size:13px;color:var(--text2);cursor:pointer;margin-bottom:12px}
.mrun{width:100%;padding:13px;background:var(--gold);color:#000;font-size:15px;font-weight:700;border:none;border-radius:var(--r);cursor:pointer}
.msel{background:var(--bg3);border:1px solid #444;border-radius:var(--rs);padding:8px 10px;font-size:14px;color:var(--text)}
.stitle{font-size:11px;color:var(--text3);letter-spacing:.1em;padding:10px 14px 4px;font-weight:600}
.empty{text-align:center;padding:48px 20px;color:var(--text2);font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div id="app">
<div class="hdr">
  <div class="hdr-top">
    <div style="flex:1">
      <div class="hdr-date" id="hdrDate"></div>
      <div class="hdr-sub" id="hdrSub"></div>
    </div>
    <div class="hdr-title">競馬AI</div>
    <div class="hdr-btn" id="rfBtn">↻</div>
  </div>
  <div class="mtabs">
    <div class="mtab on" data-mode="jra">中央競馬</div>
    <div class="mtab" data-mode="local">地方競馬</div>
  </div>
</div>
<div class="main" id="main"></div>
<div class="bnav">
  <div class="bn on" data-view="today"><div class="bn-icon">📅</div><div class="bn-lbl">今日</div></div>
  <div class="bn" data-view="browse"><div class="bn-icon">📋</div><div class="bn-lbl">会場別</div></div>
  <div class="bn" data-view="match"><div class="bn-icon">🎯</div><div class="bn-lbl">照合</div></div>
</div>
</div>

// ===== STATE =====
let st={mode:'jra',view:'today',venue:'福島',half:'後半',lV:'大井',lSeg:'後半',lDay:'土',lType:'通常',lSub:'共通',mr:[{r:1,d:''},{r:2,d:''},{r:3,d:''}],mh:'後半',mv:'福島'};
let autoRaces=null; // null=未取得, 'loading', {}=データあり, 'error', 'empty'
let hiddenVenues={jra:new Set(), local:new Set()};

function lv(){return hiddenVenues[st.mode];}
const DAYS2=['日','月','火','水','木','金','土'];
function todayDs(){const d=new Date();return String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}

// ===== FETCH =====
function renderIfToday(){if(st.view==='today'){document.getElementById('main').innerHTML=renderToday();bind();}}

async function tryFetch(proxyUrl, isJson){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),6000);
  try{
    const res=await fetch(proxyUrl,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok) return null;
    if(isJson){const j=await res.json();return j.contents||null;}
    return await res.text();
  }catch(e){clearTimeout(t);return null;}
}

async function fetchRaces(force=false){
  if(autoRaces&&autoRaces!=='error'&&autoRaces!=='fallback'&&!force) return;
  autoRaces='loading';
  renderIfToday();
  const ds=todayDs();
  const nk=`https://race.netkeiba.com/top/race_list.html?kaisai_date=${ds}`;
  const yh=`https://keiba.yahoo.co.jp/race/list/${ds}/`;

  // All proxies fire in parallel — take the first that returns real data
  let found=false;
  const attempt=async(url, isJson, parser)=>{
    const html=await tryFetch(url, isJson);
    if(!html||found) return;
    const parsed=parser(html);
    if(parsed&&Object.keys(parsed).length>0&&!found){
      found=true;
      autoRaces=parsed;
      renderIfToday();
    }
  };

  const race=Promise.all([
    attempt('https://api.allorigins.win/get?url='+encodeURIComponent(nk), true, parseNetkeiba),
    attempt('https://corsproxy.io/?url='+encodeURIComponent(nk), false, parseNetkeiba),
    attempt('https://api.allorigins.win/get?url='+encodeURIComponent(yh), true, parseYahoo),
    attempt('https://corsproxy.io/?url='+encodeURIComponent(yh), false, parseYahoo),
    attempt('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(nk), false, parseNetkeiba),
  ]);

  // 8秒で強制終了 → セグメント表示にフォールバック
  await Promise.race([race, new Promise(res=>setTimeout(res, 8000))]);

  if(!found){
    autoRaces='fallback'; // セグメント表示モードへ（エラー表示なし）
    renderIfToday();
  }
}

function parseDist(txt){
  // e.g. "芝1200m", "ダ1600m", "ダート1800m", "障害3200m", "芝・外1800m"
  const m=txt.match(/([芝ダ障])[\s・外]*(\d{3,4})/);
  if(!m) return '';
  if(m[1]==='芝') return '芝'+m[2]+'m';
  if(m[1]==='ダ') return 'ダート'+m[2]+'m';
  return '障害'+m[2]+'m';
}

function parseNetkeiba(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const result={};

  // Strategy A: Structured class-based parsing
  const blocks=doc.querySelectorAll('.RaceList_DataList,.race-list-block,[class*="RaceList_Data"]');
  blocks.forEach(block=>{
    // Find venue name
    const nameEl=block.querySelector('a,h2,h3,h4,[class*="Title"],[class*="Name"]');
    if(!nameEl) return;
    const venueTxt=nameEl.textContent.trim();
    const venue=JV.find(v=>venueTxt.includes(v));
    if(!venue) return;
    result[venue]=[];
    block.querySelectorAll('li,tr').forEach(item=>{
      const txt=item.textContent.replace(/\s+/g,' ').trim();
      const nm=txt.match(/^(\d+)R|(\d+)\s*R/);
      if(!nm) return;
      const rn=parseInt(nm[1]||nm[2]);
      if(rn<1||rn>16) return;
      const dist=parseDist(txt);
      const tm=(txt.match(/(\d{1,2}:\d{2})/)||[])[1]||'';
      if(!result[venue].find(r=>r.r===rn))
        result[venue].push({r:rn,dist,time:tm});
    });
    result[venue].sort((a,b)=>a.r-b.r);
  });

  if(Object.keys(result).length>0) return result;

  // Strategy B: Parse race_id from links
  // race_id format: YYYY(4) + kaisai(2) + venue(2) + day(2) + race(2) = 12 digits
  // venue code is at position 7-8 (index 6-7)
  const links=[...doc.querySelectorAll('a[href*="race_id="]')];
  links.forEach(link=>{
    const href=link.getAttribute('href')||'';
    // Skip position 4+2=6 digits, then capture 2-digit venue, skip 2, capture 2-digit race
    const m=href.match(/race_id=\d{6}(\d{2})\d{2}(\d{2})/);
    if(!m) return;
    const venue=PCODES[m[1]];
    const rn=parseInt(m[2]);
    if(!venue||!JV.includes(venue)||rn<1||rn>16) return;
    const txt=(link.textContent||'').replace(/\s+/g,' ').trim();
    const dist=parseDist(txt);
    const tm=(txt.match(/(\d{1,2}:\d{2})/)||[])[1]||'';
    if(!result[venue]) result[venue]=[];
    if(!result[venue].find(r=>r.r===rn))
      result[venue].push({r:rn,dist,time:tm});
  });
  Object.values(result).forEach(races=>races.sort((a,b)=>a.r-b.r));

  // Strategy C: Text-based venue detection
  if(Object.keys(result).length===0){
    const all=doc.body?.textContent||'';
    JV.forEach(venue=>{
      if(!all.includes(venue)) return;
      // Find a container that has the venue name
      doc.querySelectorAll('*').forEach(el=>{
        if(el.children.length>3&&el.textContent.includes(venue)){
          const txt=el.textContent;
          const races=[];
          const raceRe=/(\d+)R[^\d]*?(\d{1,2}:\d{2})[^\d]*?([芝ダ障][^\d]*\d{3,4})/g;
          let rm;
          while((rm=raceRe.exec(txt))!==null){
            const rn=parseInt(rm[1]);
            const time=rm[2];
            const dist=parseDist(rm[3]);
            if(rn>=1&&rn<=16&&!races.find(r=>r.r===rn))
              races.push({r:rn,dist,time});
          }
          if(races.length>3&&(!result[venue]||result[venue].length<races.length)){
            result[venue]=races.sort((a,b)=>a.r-b.r);
          }
        }
      });
    });
  }

  return result;
}

function parseYahoo(html){
  // Yahoo競馬のレース一覧ページ
  const doc=new DOMParser().parseFromString(html,'text/html');
  const result={};
  // Yahoo競馬 has tables or lists grouped by venue
  // Try to find venue headings + race rows
  doc.querySelectorAll('h3,h4,.venueTitle,[class*="venue"],[class*="Venue"],[class*="kaisai"]').forEach(hdr=>{
    const venue=JV.find(v=>hdr.textContent.includes(v));
    if(!venue) return;
    result[venue]=[];
    let el=hdr.nextElementSibling;
    let sanity=0;
    while(el&&sanity++<5){
      el.querySelectorAll('tr,li').forEach(item=>{
        const txt=item.textContent.replace(/\s+/g,' ').trim();
        const nm=txt.match(/(\d+)\s*R/);
        if(!nm) return;
        const rn=parseInt(nm[1]);
        if(rn<1||rn>16) return;
        const dist=parseDist(txt);
        const tm=(txt.match(/(\d{1,2}:\d{2})/)||[])[1]||'';
        if(!result[venue].find(r=>r.r===rn))
          result[venue].push({r:rn,dist,time:tm});
      });
      el=el.nextElementSibling;
    }
    result[venue].sort((a,b)=>a.r-b.r);
    if(!result[venue].length) delete result[venue];
  });
  return result;
}

// ===== AI MATCHING =====
function mDist(n,s){
  if(!n) return false;
  s=String(s).toLowerCase();
  if(s.includes('全距離')) return true;
  if(s.includes('以上')) return n>=parseInt(s.replace(/[^\d]/g,''));
  if(s.includes('以下')) return n<=parseInt(s.replace(/[^\d]/g,''));
  const d=parseInt(s.replace(/[^\d]/g,''));
  return d&&Math.abs(n-d)<=55;
}
function getAI(venue,rn,distStr){
  const n=parseInt(String(distStr).replace(/[^\d]/g,''))||0;
  const isTurf=String(distStr).includes('芝');
  const isJ=JV.includes(venue);
  const half=rn<=6?'前半':'後半';
  let best=null;
  const upd=(item)=>{if(!best||po(item.r)<po(best.r)) best=item;};
  if(isJ){
    const vd=JD[venue];if(!vd) return null;
    const sd=(vd[half]||{})[isTurf?'芝':'ダート'];
    if(sd) (sd.items||[]).forEach(i=>{if(mDist(n,i.d)) upd(i);});
  }else{
    const ld=LD[venue];if(!ld) return null;
    if(ld.fl){(ld.data||[]).forEach(i=>{if(mDist(n,i.d)) upd(i);});return best;}
    if(ld.ko){((ld.data||{})[st.lType]||[]).forEach(i=>{if(mDist(n,i.d)) upd(i);});return best;}
    if(ld.ob){
      const dk=DAYS2[new Date().getDay()];
      const rd=['土','日','月'].includes(dk)?dk:'平日';
      const sg=rn<=7?'前半':rn<=10?'中盤':'後半';
      const items=((ld.data||{})[rd]||{})[sg]||[];
      return items[0]||null;
    }
    if(ld.iw){
      const sg=rn<=6?'前半':rn<=9?'中盤':'後半';
      const items=((ld.data||{})[st.lSub]||{})[sg]||[];
      items.forEach(i=>{if(mDist(n,i.d)) upd(i);});
      return best;
    }
    const segs=ld.segs||['前半','中盤','後半'];
    let sg;
    if(segs.length===2) sg=rn<=6?segs[0]:segs[1];
    else sg=rn<=6?'前半':rn<=9?'中盤':'後半';
    if(!segs.includes(sg)) sg=segs[segs.length-1];
    ((ld.data||{})[sg]||[]).forEach(i=>{if(mDist(n,i.d)) upd(i);});
  }
  return best;
}

// Segment fallback display when fetch fails
function renderSegFallback(venue){
  const isJ=JV.includes(venue);
  const vd=isJ?JD[venue]:LD[venue];
  if(!vd) return '';
  const S={'t':{bg:'#1a3a28',c:'#3dbf78'},'h':{bg:'#162c1e',c:'#2ea05a'},'m':{bg:'#1a2637',c:'#5090d0'},'l':{bg:'#2a2210',c:'#c07010'},'s':{bg:'#202020',c:'#666'},'x':{bg:'#1e1212',c:'#a03030'}};
  let h=`<div class="vblock"><div class="vhdr"><span class="vname">${venue}</span><span style="font-size:10px;color:var(--text3)">期待値セグメント</span></div>`;
  if(isJ){
    ['前半','後半'].forEach(half=>{
      h+=`<div class="hdiv ${half==='前半'?'fh':'bh'}">◆ ${half==='前半'?'前半（1〜6R）':'後半（7R〜）'}</div>`;
      const hd=(vd[half]||{});
      ['芝','ダート'].forEach(sf=>{
        const sd=hd[sf];if(!sd||!sd.items||!sd.items.length) return;
        sd.items.forEach(item=>{
          const cls=rc(item.r);const sv=S[cls]||S.s;
          if(cls==='x'||cls==='s') return; // hide low-value
          h+=`<div class="segrow ${cls}">
            <div class="segleft"><span class="segtag ${cls}">${TAG[cls]||'─'}</span></div>
            <div class="segbody">
              <span class="segdist">${item.d} <span class="segsurf ${sf==='芝'?'turf':'dirt'}">${sf==='芝'?'芝':'ダ'}</span></span>
              ${item.t&&item.t!=='無し'?`<div class="segtkt">${item.t}</div>`:''}
            </div>
          </div>`;
        });
      });
    });
  }
  h+=`</div>`;
  return h;
}

// ===== RENDER TODAY =====
function renderRaceRow(venue,race){
  const ai=race.dist?getAI(venue,race.r,race.dist):null;
  const cls=ai?rc(ai.r):'nd';
  const label=TAG[cls]||'─';
  const showT=ai&&ai.t&&ai.t!=='無し'&&(cls==='t'||cls==='h'||cls==='m');
  const isTurf=race.dist&&race.dist.includes('芝');
  const isDirt=race.dist&&race.dist.includes('ダート');
  const surfHtml=race.dist?`<span class="rsurf ${isTurf?'turf':isDirt?'dirt':''}">${isTurf?'芝':isDirt?'ダ':'─'}</span>`:'';
  const distNum=race.dist?race.dist.replace(/[^\d]/g,'')+'m':'─';
  return `<div class="rrow ${cls}">
    <div class="rl">
      <span class="rtime">${race.time||'─'}</span>
      <span class="rnum">${race.r}R</span>
    </div>
    <div class="rc2">
      <div class="rdist">${race.dist?distNum+'　'+surfHtml:'距離未取得'}<span class="rtag ${cls}" style="margin-left:6px">${label}</span></div>
      ${showT?`<div class="rtkt">${ai.t}</div>`:''}
      ${ai&&ai.n?`<div class="rnote">${ai.n}</div>`:''}
    </div>
  </div>`;
}

function renderToday(){
  const vList=st.mode==='jra'?JV:LV;
  const hidden=lv();

  // Venue filter chips - show data venues if available, else all
  let venuesWithData=[];
  const hasData=autoRaces&&typeof autoRaces==='object';
  if(hasData) venuesWithData=Object.keys(autoRaces).filter(v=>vList.includes(v));
  const chipList=venuesWithData.length>0?venuesWithData:vList;

  let h=`<div class="vsel">
    <div class="vsel-lbl">${hasData?'開催場フィルター':'開催場 ─── 選択してください'} ─── タップで切替</div>
    <div class="vchips">`;
  chipList.forEach(v=>{
    const on=!hidden.has(v);
    h+=`<div class="vc${on?' on':''}" data-hv="${v}">${v}</div>`;
  });
  h+=`</div></div>`;

  // Loading state
  if(autoRaces===null){
    setTimeout(()=>fetchRaces(),0);
    autoRaces='loading';
    h+=`<div class="loading"><div class="spinner"></div><div class="load-txt">レース情報を取得中... (最大8秒)</div></div>`;
    return h;
  }
  if(autoRaces==='loading'){
    h+=`<div class="loading"><div class="spinner"></div><div class="load-txt">レース情報を取得中...</div></div>`;
    return h;
  }

  // Fallback: auto-fetch failed → show segment view (no scary error message)
  if(autoRaces==='fallback'||autoRaces==='error'){
    h+=`<div style="padding:8px 14px;background:#161a10;border-bottom:1px solid #2a3018;display:flex;align-items:center;gap:10px">
      <span style="font-size:12px;color:#7a9040;flex:1">ライブ取得できませんでした。期待値セグメントを表示しています。</span>
      <button id="retryBtn" style="padding:4px 10px;background:#1e2a0a;border:1px solid #4a6020;border-radius:8px;font-size:11px;color:#9ab040;cursor:pointer;white-space:nowrap">↻ 再試行</button>
    </div>`;
    // Show chips + segment fallback for selected venues
    const shown=vList.filter(v=>!hidden.has(v));
    if(!shown.length){
      h+=`<div class="empty">上から本日の開催場をタップしてください</div>`;
    } else {
      shown.forEach(venue=>h+=renderSegFallback(venue));
    }
    return h;
  }

  // Success: show live race data
  const visibleVenues=venuesWithData.filter(v=>!hidden.has(v));
  if(!visibleVenues.length){
    h+=`<div class="empty">会場をタップして表示</div>`;
    return h;
  }

  visibleVenues.forEach(venue=>{
    const races=autoRaces[venue]||[];
    const good=races.filter(r=>{
      if(!r.dist) return false;
      const ai=getAI(venue,r.r,r.dist);
      if(!ai) return false;
      const c=rc(ai.r);
      return c==='t'||c==='h'||c==='m';
    });
    h+=`<div class="vblock">
      <div class="vhdr">
        <span class="vname">${venue}</span>
        <span class="vcount">${races.length}R${good.length>0?`　<span style="color:#3dbf78">◎/〇 ${good.length}件</span>`:''}</span>
      </div>`;
    let prevH='';
    races.forEach(race=>{
      const half=race.r<=6?'前半':'後半';
      if(half!==prevH){
        h+=`<div class="hdiv ${half==='前半'?'fh':'bh'}">${half==='前半'?'── 前半（1〜6R）':'── 後半（7R〜）'}</div>`;
        prevH=half;
      }
      h+=renderRaceRow(venue,race);
    });
    h+=`</div>`;
  });
  return h;
}

      h+=`</div>`;(((vd.data||{})[st.lDay]||{})[st.lSeg]||[]).forEach(i=>h+=mc(i));
    }else if(vd.iw){
      h+=`<div style="display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #232830">`;
      ['共通','水沢','盛岡'].forEach(s=>h+=`<div class="sbtn${st.lSub===s?' on':''}" data-lsub="${s}">${s}</div>`);
      h+=`</div>`;
      h+=`<div style="display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #232830">`;
      (vd.segs||['前半','中盤','後半']).forEach(sg=>h+=`<div class="sbtn${st.lSeg===sg?' on':''}" data-lseg="${sg}">${sg}</div>`);
      h+=`</div>`;(((vd.data||{})[st.lSub]||{})[st.lSeg]||[]).forEach(i=>h+=mc(i));
    }else{
      const segs=vd.segs||['前半','中盤','後半'];
      h+=`<div style="display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #232830">`;
      segs.forEach(sg=>h+=`<div class="sbtn${st.lSeg===sg?' on':''}" data-lseg="${sg}">${sg}</div>`);
      h+=`</div>`;((vd.data||{})[st.lSeg]||[]).forEach(i=>h+=mc(i));
    }
  }
  return h;
}

// ===== MATCH =====
function renderMatch(){
  const isJ=st.mode==='jra';
  const vList=isJ?JV:LV;
  let h=`<div class="mwrap">
    <div class="mhint">JRAアプリで確認した距離を入力して照合。例: ダ1700 / 芝1200</div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <select class="msel" id="mV">`;
  vList.forEach(v=>h+=`<option value="${v}"${v===st.mv?' selected':''}>${v}</option>`);
  h+=`</select>`;
  if(isJ) h+=`<select class="msel" id="mH"><option value="前半"${st.mh==='前半'?' selected':''}>前半(〜6R)</option><option value="後半"${st.mh==='後半'?' selected':''}>後半(7R〜)</option></select>`;
  h+=`</div>`;
  st.mr.forEach((race,i)=>{
    h+=`<div class="mrow"><span class="mrn">${race.r}R</span><input class="minp" type="text" placeholder="例: ダ1700" value="${race.d}" data-mi="${i}" id="mi${i}"><div class="mdel" data-mdel="${i}">✕</div></div>`;
  });
  h+=`<div class="madd" id="mAdd">＋ レース追加</div><button class="mrun" id="mRun">照合する</button>`;
  const res=st.mr.filter(r=>r.d.trim()).map(r=>{
    const ai=getAI(st.mv,r.r,r.d);
    const cls=ai?rc(ai.r):'nd';
    return {r:r.r,d:r.d,cls,label:TAG[cls]||'─',t:ai&&ai.t?ai.t:'',n:ai&&ai.n?ai.n:''};
  });
  if(res.length){
    h+=`<div class="stitle" style="margin-top:14px">照合結果</div>`;
    res.forEach(r=>{
      h+=`<div class="rrow ${r.cls}" style="border-radius:var(--rs);margin:4px 0">
        <div class="rl"><span class="rnum">${r.r}R</span></div>
        <div class="rc2">
          <div class="rdist">${r.d}<span class="rtag ${r.cls}" style="margin-left:8px">${r.label}</span></div>
          ${r.t?`<div class="rtkt">${r.t}</div>`:''}
          ${r.n?`<div class="rnote">${r.n}</div>`:''}
        </div>
      </div>`;
    });
  }
  return h+'</div>';
}

// ===== CORE =====
function render(){
  const m=document.getElementById('main');
  if(st.view==='today') m.innerHTML=renderToday();
  else if(st.view==='browse') m.innerHTML=renderBrowse();
  else m.innerHTML=renderMatch();
  bind();
}
function bind(){
  document.querySelectorAll('[data-hv]').forEach(el=>el.addEventListener('click',()=>{
    const v=el.dataset.hv;
    if(lv().has(v)) lv().delete(v); else lv().add(v);
    render();
  }));
  const rb=document.getElementById('retryBtn');
  if(rb) rb.addEventListener('click',()=>fetchRaces(true));
  document.querySelectorAll('[data-bv]').forEach(el=>el.addEventListener('click',()=>{if(st.mode==='jra') st.venue=el.dataset.bv; else st.lV=el.dataset.bv;render();}));
  document.querySelectorAll('[data-half]').forEach(el=>el.addEventListener('click',()=>{st.half=el.dataset.half;render();}));
  document.querySelectorAll('[data-lseg]').forEach(el=>el.addEventListener('click',()=>{st.lSeg=el.dataset.lseg;render();}));
  document.querySelectorAll('[data-lday]').forEach(el=>el.addEventListener('click',()=>{st.lDay=el.dataset.lday;render();}));
  document.querySelectorAll('[data-ltype]').forEach(el=>el.addEventListener('click',()=>{st.lType=el.dataset.ltype;render();}));
  document.querySelectorAll('[data-lsub]').forEach(el=>el.addEventListener('click',()=>{st.lSub=el.dataset.lsub;render();}));
  const mV=document.getElementById('mV');if(mV) mV.addEventListener('change',()=>{st.mv=mV.value;render();});
  const mH=document.getElementById('mH');if(mH) mH.addEventListener('change',()=>{st.mh=mH.value;render();});
  document.querySelectorAll('[data-mi]').forEach(el=>{
    el.addEventListener('input',()=>{st.mr[+el.dataset.mi].d=el.value;});
    el.addEventListener('change',()=>render());
  });
  document.querySelectorAll('[data-mdel]').forEach(el=>el.addEventListener('click',()=>{
    if(st.mr.length>1){st.mr.splice(+el.dataset.mdel,1);st.mr.forEach((r,j)=>r.r=j+1);}render();
  }));
  const mAdd=document.getElementById('mAdd');if(mAdd) mAdd.addEventListener('click',()=>{
    const n=st.mr.length+1;st.mr.push({r:n,d:''});render();
    setTimeout(()=>{const el=document.getElementById('mi'+(n-1));if(el) el.focus();},50);
  });
  const mRun=document.getElementById('mRun');if(mRun) mRun.addEventListener('click',()=>render());
}
document.querySelectorAll('.mtab').forEach(t=>t.addEventListener('click',()=>{
  st.mode=t.dataset.mode;
  document.querySelectorAll('.mtab').forEach(x=>x.classList.toggle('on',x===t));
  autoRaces=null; // reset on mode switch
  render();
}));
document.querySelectorAll('.bn').forEach(b=>b.addEventListener('click',()=>{
  st.view=b.dataset.view;
  document.querySelectorAll('.bn').forEach(x=>x.classList.toggle('on',x===b));
  render();
}));
document.getElementById('rfBtn').addEventListener('click',()=>{
  const btn=document.getElementById('rfBtn');
  btn.style.transition='transform .4s';btn.style.transform='rotate(360deg)';
  setTimeout(()=>{btn.style.transform='';btn.style.transition='';},400);
  const d=new Date();
  document.getElementById('hdrDate').textContent=`${d.getMonth()+1}月${d.getDate()}日（${DAYS[d.getDay()]}）`;
  if(st.view==='today') fetchRaces(true);
  else render();
});
(function init(){
  const d=new Date();
  document.getElementById('hdrDate').textContent=`${d.getMonth()+1}月${d.getDate()}日（${DAYS[d.getDay()]}）`;
  document.getElementById('hdrSub').textContent=DNAMES[d.getDay()];
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
})();
</script>
</body>
</html>
