<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="競馬AI">
<link rel="manifest" href="manifest.json">
<title>競馬AIガイド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#111318;--bg2:#1a1d24;--bg3:#22252f;
  --gold:#d4a017;--gold2:#f0c040;--gold3:#7a5a00;
  --green:#2a7a4f;--green2:#3dbf78;
  --red:#8a2020;--red2:#e05050;
  --blue:#1a4a8a;--blue2:#5090d0;
  --amber:#8a5a00;--amber2:#e09020;
  --gray:#888;--gray2:#555;--gray3:#333;
  --text:#e8e0d0;--text2:#aaa;--text3:#666;
  --radius:12px;--radius-sm:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kochi GoThic',sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* Header */
.hdr{background:var(--bg);padding:env(safe-area-inset-top,12px) 16px 0;border-bottom:1px solid #2a2d35;flex-shrink:0}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
.hdr-date{font-size:13px;color:var(--gold);font-weight:600;letter-spacing:.05em}
.hdr-day{font-size:11px;color:var(--text2);margin-top:1px}
.hdr-title{font-size:17px;font-weight:700;letter-spacing:.02em}
.hdr-refresh{width:32px;height:32px;background:var(--bg3);border:1px solid var(--gray3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:.2s}
.hdr-refresh:active{transform:scale(.9)}

/* Mode tabs */
.mode-tabs{display:flex;gap:0;padding:0 4px 0;overflow-x:auto;scrollbar-width:none}
.mode-tabs::-webkit-scrollbar{display:none}
.mode-tab{flex:0 0 auto;padding:8px 14px;font-size:13px;color:var(--text2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:.15s}
.mode-tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}

/* Main scroll area */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 env(safe-area-inset-bottom,20px)}

/* Today view */
.today-hero{padding:16px;background:linear-gradient(135deg,#1a1d24 0%,#111318 100%);border-bottom:1px solid #2a2d35}
.today-venues{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.venue-chip{padding:6px 12px;background:var(--bg3);border:1px solid var(--gray3);border-radius:20px;font-size:12px;cursor:pointer;transition:.15s}
.venue-chip.central{border-color:#4a6fa5}
.venue-chip.local{border-color:#5a8a4a}
.venue-chip.active{border-color:var(--gold);color:var(--gold);background:#1f1a0a}
.venue-chip:active{transform:scale(.95)}

.section-title{font-size:11px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:12px 16px 6px;font-weight:600}

/* Race cards */
.race-card{background:var(--bg2);border:1px solid #2a2d35;border-radius:var(--radius);margin:6px 12px;padding:12px 14px;transition:.15s;cursor:pointer}
.race-card:active{transform:scale(.98)}
.race-card.priority-top{border-left:3px solid var(--green2);border-color:var(--green2)}
.race-card.priority-high{border-left:3px solid var(--gold)}
.race-card.priority-mid{border-left:3px solid #5090d0}
.race-card.priority-low{border-left:3px solid var(--gray2)}
.race-card.priority-skip{opacity:.4}
.rc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rc-venue{font-size:12px;color:var(--text2);background:var(--bg3);padding:2px 8px;border-radius:4px}
.rc-race{font-size:15px;font-weight:700}
.rc-dist{font-size:13px;color:var(--text2)}
.rc-time{font-size:12px;color:var(--text3);margin-left:auto}
.rc-rating{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;white-space:nowrap}
.rc-rating.top{background:#1a3a2a;color:var(--green2)}
.rc-rating.high{background:#2a2000;color:var(--gold)}
.rc-rating.mid{background:#1a2a3a;color:var(--blue2)}
.rc-rating.low{background:#2a2a2a;color:#888}
.rc-rating.skip{background:#2a1a1a;color:var(--red2)}
.rc-tickets{font-size:13px;color:var(--text);line-height:1.5;background:var(--bg3);border-radius:var(--radius-sm);padding:8px 10px;margin-top:2px}
.rc-note{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.4}

/* Venue browser */
.seg-bar{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #2a2d35;position:sticky;top:0;background:var(--bg);z-index:10}
.seg-bar::-webkit-scrollbar{display:none}
.seg-btn{flex:0 0 auto;padding:5px 12px;background:var(--bg3);border:1px solid var(--gray3);border-radius:16px;font-size:12px;cursor:pointer;white-space:nowrap;transition:.15s}
.seg-btn.on{background:#1f1a0a;border-color:var(--gold);color:var(--gold)}
.seg-btn:active{transform:scale(.95)}

.surf-label{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:10px;margin:12px 12px 6px}
.surf-label.turf{background:#1a3020;color:var(--green2)}
.surf-label.dirt{background:#2a2010;color:var(--amber2)}
.surf-label.special{background:#1a1a2a;color:var(--blue2)}

.seg-card{background:var(--bg2);border:1px solid #2a2d35;border-radius:var(--radius);margin:4px 12px;padding:12px 14px}
.seg-dist{font-size:15px;font-weight:700;color:var(--text)}
.seg-rating{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.seg-tickets{font-size:13px;color:var(--text);margin-top:6px;line-height:1.5}
.seg-note{font-size:11px;color:var(--text2);margin-top:4px}

/* Race matcher */
.matcher-wrap{padding:12px}
.match-instructions{font-size:12px;color:var(--text2);background:var(--bg2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;line-height:1.5}
.match-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.match-r{font-size:13px;font-weight:700;color:var(--gold);width:28px;flex-shrink:0}
.match-input{flex:1;background:var(--bg3);border:1px solid var(--gray3);border-radius:var(--radius-sm);padding:8px 10px;font-size:14px;color:var(--text);-webkit-appearance:none}
.match-input:focus{outline:none;border-color:var(--gold)}
.match-del{width:32px;height:32px;background:var(--bg3);border:1px solid var(--gray3);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;color:var(--text2)}
.match-del:active{background:var(--red)}
.add-race-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;background:var(--bg2);border:1px dashed var(--gray3);border-radius:var(--radius-sm);font-size:13px;color:var(--text2);cursor:pointer;margin-bottom:12px}
.add-race-btn:active{background:var(--bg3)}
.run-match-btn{width:100%;padding:13px;background:var(--gold);color:#000;font-size:15px;font-weight:700;border:none;border-radius:var(--radius);cursor:pointer;transition:.15s}
.run-match-btn:active{transform:scale(.98);background:var(--gold2)}
.match-venue-sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.match-venue-sel select{flex:1;background:var(--bg3);border:1px solid var(--gray3);border-radius:var(--radius-sm);padding:8px 10px;font-size:14px;color:var(--text);-webkit-appearance:none;appearance:none}
.match-venue-sel select:focus{outline:none;border-color:var(--gold)}

/* Bottom nav */
.bnav{display:flex;background:var(--bg);border-top:1px solid #2a2d35;padding-bottom:env(safe-area-inset-bottom,0);flex-shrink:0}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;color:var(--text3);transition:.15s;gap:2px}
.bnav-item.on{color:var(--gold)}
.bnav-icon{font-size:22px;line-height:1}
.bnav-label{font-size:9px;font-weight:600;letter-spacing:.03em}
.bnav-item:active{opacity:.7}

.empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px}
.tag-day{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg3);color:var(--text2);margin-left:4px}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-top">
      <div>
        <div class="hdr-date" id="hdrDate"></div>
        <div class="hdr-day" id="hdrDay"></div>
      </div>
      <div class="hdr-title">競馬AI</div>
      <div class="hdr-refresh" onclick="refreshData()" title="更新">↻</div>

    <div class="mode-tabs">
      <div class="mode-tab on" onclick="setMode('jra')" id="tab-jra">中央</div>
      <div class="mode-tab" onclick="setMode('local')" id="tab-local">地方</div>
    </div>
  </div>
  <div class="main" id="mainArea"></div>
  <div class="bnav">
    <div class="bnav-item on" onclick="setView('today')" id="nav-today">
      <div class="bnav-icon">☀️</div>
      <div class="bnav-label">今日</div>
    </div>
    <div class="bnav-item" onclick="setView('browse')" id="nav-browse">

      <div class="bnav-label">会場別</div>
    </div>
    <div class="bnav-item" onclick="setView('match')" id="nav-match">
      <div class="bnav-icon">🎯</div>
      <div class="bnav-label">照合</div>
    </div>
  </div>
</div>

let st={
  mode:'jra',view:'today',
  jVenues:['福島','東京','京都'],
  lVenues:['帯広','高知','佐賀'],
  venue:'福島',half:'後半',lV:'大井',lSeg:'後半',lDay:'土',lType:'通常',lSub:'共通',
  matchVenue:'福島',matchHalf:'後半',matchRaces:[{r:1,d:''},{r:2,d:''},{r:3,d:''}]
};

function ratingClass(r){return RS[r]||'low';}

function getRatingTag(r){
  const c=ratingClass(r);
  const t=RT[c]||RT.low;
  return `<span class="rc-rating ${t.cls}">${t.label}</span>`;
}

function getSegRating(r){
  const c=ratingClass(r);
  const t=RT[c]||RT.low;
  return `<span class="seg-rating ${t.cls}" style="background:${c==='top'?'#1a3a2a':c==='high'?'#2a2000':c==='mid'?'#1a2a3a':c==='low'?'#2a2a2a':'#2a1a1a'};color:${c==='top'?'#3dbf78':c==='high'?'#e09020':c==='mid'?'#5090d0':c==='low'?'#888':'#e05050'}">${t.label}</span>`;
}

function today(){
  const d=new Date();
  document.getElementById('hdrDate').textContent=`${d.getMonth()+1}月${d.getDate()}日（${DAYS[d.getDay()]}）`;
  document.getElementById('hdrDay').textContent=DAY_NAMES[d.getDay()];
  return d;
}

function setMode(m){
  st.mode=m;
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.toggle('on',t.id==='tab-'+m));
  render();
}
function setView(v){
  st.view=v;
  document.querySelectorAll('.bnav-item').forEach(t=>t.classList.toggle('on',t.id==='nav-'+v));
  render();
}
function render(){
  const m=document.getElementById('mainArea');
  if(st.view==='today') m.innerHTML=renderToday();
  else if(st.view==='browse') m.innerHTML=renderBrowse();
  else m.innerHTML=renderMatch();
  bindEvents();
}

function renderToday(){
  const d=new Date();
  const dayKey=['日','月','火','水','木','金','土'][d.getDay()];
  const venues=st.mode==='jra'?JV:LV;
  const active=st.mode==='jra'?st.jVenues:st.lVenues;
  let h=`<div class="today-hero">
    <div style="font-size:12px;color:var(--text2);margin-bottom:8px">開催場を選択してください</div>
    <div class="today-venues">`;
  venues.forEach(v=>{
    const on=active.includes(v);
    const cls=JV.includes(v)?'central':'local';
    h+=`<div class="venue-chip ${cls}${on?' active':''}" data-venue="${v}" data-toggle="venue">${v}</div>`;
  });
  h+=`</div></div>`;

  const topRecs=[];
  active.forEach(v=>{
    if(st.mode==='jra'){
      const vd=JD[v];if(!vd) return;
      ['前半','後半'].forEach(half=>{
        const hd=vd[half]||{};
        ['芝','ダート'].forEach(surf=>{
          const sd=hd[surf];if(!sd) return;
          (sd.items||[]).forEach(item=>{
            const c=ratingClass(item.r);
            if(c==='top'||c==='high') topRecs.push({v,half,surf,d:item.d,r:item.r,t:item.t,n:item.n,c});
          });
        });
      });
    } else {
      const vd=LD[v];if(!vd) return;
      if(vd.flat){(vd.data||[]).forEach(item=>{const c=ratingClass(item.r);if(c==='top'||c==='high') topRecs.push({v,half:'',surf:'',d:item.d,r:item.r,t:item.t,n:item.n,c});});return;}
      if(vd.kochi){Object.keys(vd.data||{}).forEach(type=>{(vd.data[type]||[]).forEach(item=>{const c=ratingClass(item.r);if(c==='top'||c==='high') topRecs.push({v,half:type,surf:'',d:item.d,r:item.r,t:item.t,n:item.n,c});});});return;}
      if(vd.obihiro){
        const dayD=v==='帯広'?(['日','月'].includes(dayKey)?dayKey:['土','日','月'].includes(dayKey)?dayKey:'平日'):'平日';
        const realDay=['土','日','月'].includes(dayKey)?dayKey:'平日';
        const dd=vd.data[realDay]||{};
        Object.keys(dd).forEach(seg=>{(dd[seg]||[]).forEach(item=>{const c=ratingClass(item.r);if(c==='top'||c==='high') topRecs.push({v,half:seg,surf:'頭数別',d:item.d,r:item.r,t:item.t,n:item.n,c});});});
        return;
      }
      const segs=vd.segs||['前半','中盤','後半'];
      segs.forEach(seg=>{(vd.data[seg]||[]).forEach(item=>{const c=ratingClass(item.r);if(c==='top'||c==='high') topRecs.push({v,half:seg,surf:'',d:item.d,r:item.r,t:item.t,n:item.n,c});});});
    }
  });

  topRecs.sort((a,b)=>a.c==='top'&&b.c!=='top'?-1:b.c==='top'&&a.c!=='top'?1:0);

  if(!active.length) return h+'<div class="empty">上から開催場を選んでください</div>';
  if(!topRecs.length) return h+'<div class="section-title">推奨セグメント</div><div class="empty">◎・〇評価なし</div>';

  h+='<div class="section-title">本日の推奨セグメント</div>';
  topRecs.forEach(rec=>{
    const pClass=rec.c==='top'?'priority-top':'priority-high';
    h+=`<div class="race-card ${pClass}">
      <div class="rc-head">
        <span class="rc-venue">${rec.v}</span>
        ${rec.half?`<span class="rc-dist">${rec.half}</span>`:''}
        ${rec.surf?`<span class="rc-dist">${rec.surf}</span>`:''}
        <span class="rc-dist" style="color:var(--text)">${rec.d}</span>
        ${getRatingTag(rec.r)}
      </div>
      <div class="rc-tickets">${rec.t||''}</div>
      ${rec.n?`<div class="rc-note">${rec.n}</div>`:''}
    </div>`;
  });
  return h;
}

function renderMatch(){
  const isJra=st.mode==='jra';
  const vList=isJra?JV:LV;
  const vData=isJra?JD:LD;
  const mv=st.matchVenue;
  let h=`<div class="matcher-wrap">
    <div class="match-instructions">JRAアプリ等で確認した出馬表の距離を入力 → 推奨レースを自動判定<br>例: 1R ダ1700m → 入力欄に「ダ1700」または「1700」</div>
    <div class="match-venue-sel">
      <select id="matchVenue">`;
  vList.forEach(v=>h+=`<option value="${v}"${v===mv?' selected':''}>${v}</option>`);
  h+=`</select>`;
  if(isJra){
    h+=`<select id="matchHalf"><option value="前半"${st.matchHalf==='前半'?' selected':''}>前半(〜6R)</option><option value="後半"${st.matchHalf==='後半'?' selected':''}>後半(7R〜)</option></select>`;
  }
  h+=`</div>`;
  st.matchRaces.forEach((race,i)=>{
    h+=`<div class="match-row">
      <span class="match-r">${race.r}R</span>
      <input class="match-input" type="text" inputmode="text" placeholder="例: ダ1700 / 芝1200" value="${race.d}" data-midx="${i}" id="mi${i}">
      <div class="match-del" data-mdel="${i}">✕</div>
    </div>`;
  });
  h+=`<div class="add-race-btn" id="addRaceBtn">＋ レース追加</div>
    <button class="run-match-btn" id="runMatchBtn">照合する</button>`;

  const results=doMatch(mv,vData);
  if(results.length){
    h+='<div class="section-title" style="margin-top:12px">照合結果</div>';
    results.forEach(res=>{
      const pCls=res.c==='top'?'priority-top':res.c==='high'?'priority-high':res.c==='mid'?'priority-mid':res.c==='low'?'priority-low':'priority-skip';
      h+=`<div class="race-card ${pCls}">
        <div class="rc-head">
          <span class="rc-race">${res.r}R</span>
          <span class="rc-dist">${res.inputDist}</span>
          ${getRatingTag(res.rating)}
          ${res.time?`<span class="rc-time">${res.time}</span>`:''}
        </div>
        ${res.tickets?`<div class="rc-tickets">${res.tickets}</div>`:''}
        ${res.note?`<div class="rc-note">${res.note}</div>`:''}
      </div>`;
    });
  }
  return h+'</div>';
}

function doMatch(venue,vData){
  const results=[];
  const vd=vData[venue];
  if(!vd) return results;
  st.matchRaces.forEach(race=>{
    if(!race.d.trim()) return;
    const dist=race.d.trim();
    const num=parseInt(dist.replace(/[^\d]/g,''))||0;
    const isTurf=dist.includes('芝')||(!dist.includes('ダ')&&!dist.includes('d')&&!dist.toLowerCase().includes('d'));
    let bestItem=null,bestC='skip';
    const half=st.matchHalf;

    if(st.mode==='jra'){
      const hd=(vd[half]||{});
      ['芝','ダート'].forEach(surf=>{
        if(surf==='芝'&&!isTurf) return;
        if(surf==='ダート'&&isTurf) return;
        const sd=hd[surf];if(!sd) return;
        (sd.items||[]).forEach(item=>{
          const dnum=parseInt(item.d.replace(/[^\d]/g,''))||0;
          const match=matchDist(num,item.d);
          if(match){
            const c=ratingClass(item.r);
            const ord=['top','high','mid','low','skip'];
            if(ord.indexOf(c)<ord.indexOf(bestC)){bestC=c;bestItem=item;}
          }
        });
      });
    } else {
      if(vd.flat){
        (vd.data||[]).forEach(item=>{if(matchDist(num,item.d)){const c=ratingClass(item.r);const ord=['top','high','mid','low','skip'];if(ord.indexOf(c)<ord.indexOf(bestC)){bestC=c;bestItem=item;}}});
      } else if(!vd.kochi&&!vd.obihiro&&!vd.iwate){
        const items=(vd.data||{})[st.lSeg]||[];
        items.forEach(item=>{if(matchDist(num,item.d)){const c=ratingClass(item.r);const ord=['top','high','mid','low','skip'];if(ord.indexOf(c)<ord.indexOf(bestC)){bestC=c;bestItem=item;}}});
      }
    }
    results.push({r:race.r,inputDist:dist,rating:bestItem?.r||'—',tickets:bestItem?.t||'該当セグメントなし',note:bestItem?.n||'',c:bestC,time:''});
  });
  return results;
}

function matchDist(num,distStr){
  if(!num) return false;
  const s=distStr.toLowerCase();
  if(s.includes('以上')) return num>=parseInt(s.replace(/[^\d]/g,''));
  if(s.includes('以下')) return num<=parseInt(s.replace(/[^\d]/g,''));
  const dnum=parseInt(s.replace(/[^\d]/g,''));
  return Math.abs(num-dnum)<=50;
}

function bindEvents(){
  document.querySelectorAll('[data-toggle="venue"]').forEach(el=>{
    el.addEventListener('click',()=>{
      const v=el.dataset.venue;
      const arr=st.mode==='jra'?st.jVenues:st.lVenues;
      const idx=arr.indexOf(v);
      if(idx>=0) arr.splice(idx,1); else arr.push(v);
      render();
    });
  });
  document.querySelectorAll('[data-bvenue]').forEach(el=>{
    el.addEventListener('click',()=>{
      if(st.mode==='jra') st.venue=el.dataset.bvenue;
      else st.lV=el.dataset.bvenue;
      render();
    });
  });
  document.querySelectorAll('[data-half]').forEach(el=>el.addEventListener('click',()=>{st.half=el.dataset.half;render();}));
  document.querySelectorAll('[data-lseg]').forEach(el=>el.addEventListener('click',()=>{st.lSeg=el.dataset.lseg;render();}));
  document.querySelectorAll('[data-lday]').forEach(el=>el.addEventListener('click',()=>{st.lDay=el.dataset.lday;render();}));
  document.querySelectorAll('[data-ltype]').forEach(el=>el.addEventListener('click',()=>{st.lType=el.dataset.ltype;render();}));
  document.querySelectorAll('[data-lsub]').forEach(el=>el.addEventListener('click',()=>{st.lSub=el.dataset.lsub;render();}));
  const mv=document.getElementById('matchVenue');
  if(mv) mv.addEventListener('change',()=>{st.matchVenue=mv.value;render();});
  const mh=document.getElementById('matchHalf');
  if(mh) mh.addEventListener('change',()=>{st.matchHalf=mh.value;render();});
  document.querySelectorAll('[data-midx]').forEach(el=>{
    el.addEventListener('input',()=>{st.matchRaces[parseInt(el.dataset.midx)].d=el.value;});
    el.addEventListener('change',()=>{render();});
  });
  document.querySelectorAll('[data-mdel]').forEach(el=>{
    el.addEventListener('click',()=>{
      const i=parseInt(el.dataset.mdel);
      if(st.matchRaces.length>1){st.matchRaces.splice(i,1);st.matchRaces.forEach((r,j)=>r.r=j+1);render();}
    });
  });
  const addBtn=document.getElementById('addRaceBtn');
  if(addBtn) addBtn.addEventListener('click',()=>{
    const next=st.matchRaces.length+1;
    st.matchRaces.push({r:next,d:''});render();
    setTimeout(()=>{const inp=document.getElementById('mi'+(next-1));if(inp) inp.focus();},50);
  });
  const runBtn=document.getElementById('runMatchBtn');
  if(runBtn) runBtn.addEventListener('click',()=>render());
}

function refreshData(){
  document.querySelector('.hdr-refresh').style.transform='rotate(360deg)';
  document.querySelector('.hdr-refresh').style.transition='transform .5s';
  setTimeout(()=>{document.querySelector('.hdr-refresh').style.transform='';document.querySelector('.hdr-refresh').style.transition='';},500);
  today();render();
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

today();
render();
</script>
